# Render Infrastructure as Code (Blueprint)
# Sikho Trading Paper Trading Platform — Web Service & Managed PostgreSQL
services:
  - type: web
    name: sikho-trading-api
    runtime: node
    plan: starter
    region: singapore # Low latency to India (NSE / Upstox servers)
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build:backend
    startCommand: npm run start:backend:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: sikho-trading-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: UPSTOX
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false # Set securely in Render dashboard
      - key: GOOGLE_CLIENT_ID
        value: 18709659572-6d1j4db60j60vo0a0ek5kumvv06vu4fi.apps.googleusercontent.com
      - key: ENFORCE_LOCAL_DEV_IP
        value: "false"

databases:
  - name: sikho-trading-db
    plan: starter
    region: singapore
    databaseName: sikho_trading
    user: sikho_admin
    ipAllowList: [] # Allows access only from internal Render web services

