apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.indianpapertrading"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.indianpapertrading"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.0.6"
    }

    buildFeatures {
        buildConfig true
    }

    def prodServerUrl = project.hasProperty("serverUrl") ? project.property("serverUrl") : (System.getenv("SERVER_URL") ?: "https://sikho-trading-api.onrender.com")
    def debugServerUrl = project.hasProperty("debugServerUrl") ? project.property("debugServerUrl") : (System.getenv("DEBUG_SERVER_URL") ?: "https://sikho-trading-api.onrender.com")

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-3940256099942544~3347511713"
            ]
            buildConfigField "String", "BANNER_AD_UNIT_ID", "\"ca-app-pub-3940256099942544/9214589741\""
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"${debugServerUrl}\""
            buildConfigField "boolean", "ENABLE_DEV_SERVER_PICKER", "true"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [
                admobAppId: "ca-app-pub-3649125435732222~6082535411"
            ]
            buildConfigField "String", "BANNER_AD_UNIT_ID", "\"ca-app-pub-3649125435732222/1906506742\""
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"ca-app-pub-3649125435732222/6775690042\""
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"${prodServerUrl}\""
            buildConfigField "boolean", "ENABLE_DEV_SERVER_PICKER", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.webkit:webkit:1.12.1")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("androidx.credentials:credentials:1.3.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
    implementation("com.google.android.gms:play-services-ads:23.6.0")
    implementation("com.google.android.ump:user-messaging-platform:3.1.0")
}
